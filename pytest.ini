[pytest]
# Reduce CI noise: filter known SQLAlchemy compatibility warnings
# - Slot polymorphic relationships are intentional, not bugs
# - DeprecationWarning: defer SQLAlchemy 2.0 migration noise
# Note: do not reference RemovedIn20Warning / MovedIn20Warning by name —
# those classes differ across SQLAlchemy versions and break pytest config.
filterwarnings =
    ignore::sqlalchemy.exc.SAWarning
    ignore::DeprecationWarning:sqlalchemy.*
